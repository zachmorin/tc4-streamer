<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Live DJ sets, streamed direct." />
    <title>LIVE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='3' y='4' width='10' height='8' fill='%2333ff33'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="site-title">ZACH MORIN</h1>
        <div class="sub">live.dj // direct from the decks</div>
      </header>

      <div class="status">
        <span id="status-pill" class="pill">OFFLINE</span>
        <span id="status-detail" class="sub"></span>
      </div>

      <div class="video-wrap">
        <video id="player" autoplay playsinline></video>
        <div id="overlay" class="video-overlay">
          <div><span id="overlay-text">NO SIGNAL</span><span class="cursor"></span></div>
        </div>
      </div>

      <div id="stats" class="stats"></div>

      <hr />
      <pre id="log" class="log" aria-live="polite"></pre>

      <footer>
        <span>ultra-low latency via WebRTC</span>
      </footer>
    </main>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
